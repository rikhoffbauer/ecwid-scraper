name: Sync Ecwid stores

on:
  workflow_dispatch:
    inputs:
      store_id:
        description: "Optional Ecwid store id to sync. Leave empty for all due stores."
        required: false
        type: string
      force:
        description: "Ignore per-store sync intervals."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ecwid-store-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Arbitrary stores added from the web UI can be supplied through this JSON map:
  # {"99490018":"public_...","other-store":"secret_..."}
  ECWID_STORE_TOKENS_JSON: ${{ secrets.ECWID_STORE_TOKENS_JSON }}
  # Backwards-compatible explicit token envs can still be used.
  ECWID_99490018_TOKEN: ${{ secrets.ECWID_99490018_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run check && bun run web:check

      - name: Test
        run: bun test

      - name: Sync store orphan branches
        shell: bash
        env:
          STORE_ID: ${{ github.event.inputs.store_id || '' }}
          FORCE_SYNC: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          args=(--config config/ecwid-stores.json)

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            args+=(--due-only)
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$FORCE_SYNC" == "true" ]]; then
            args+=(--force)
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "$FORCE_SYNC" != "true" ]]; then
            args+=(--due-only)
          fi

          if [[ -n "$STORE_ID" ]]; then
            args+=(--store "$STORE_ID")
          fi

          bun run src/sync-store-branches.ts "${args[@]}"
